spring:
  application:
    name: pupr-be

  # Virtual threads on the web layer (03-System_Technical_Architecture.txt section 1.1)
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${PUPR_DB_URL:jdbc:postgresql://localhost:5432/pupr}
    username: ${PUPR_DB_USERNAME:pupr}
    password: ${PUPR_DB_PASSWORD:pupr}

  jpa:
    hibernate:
      # Flyway owns the schema. Never 'update'.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PUPR_SERVER_PORT:8080}
